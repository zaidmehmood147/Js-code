<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
        body { text-align: center; background-color: #f0f0f0; padding-top: 50px; }

        /* The Animation */
        @keyframes spinAndBounce {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.2) rotate(180deg); }
            100% { transform: scale(1) rotate(360deg); }
        }

        #cat-container {
            display: none;
            margin-top: 30px;
        }

        .dancing-cat {
            width: 250px;
            /* Applying the "dance" movement */
            animation: spinAndBounce 2s infinite linear;
            border-radius: 50%;
        }
    </style>
<body>
    <button onclick="summonDance()" style="padding: 15px 30px; font-size: 20px; cursor: pointer; background-color: black;">
        CLICK ME
    </button>

    <div id="cat-container">
        <img src="oiia.jpg" 
             class="dancing-cat" alt="Spinning Cat">
      
    </div>
    <script src="main.js"></script>
</body>
</html>
